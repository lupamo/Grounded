services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grounded-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded_pass
      POSTGRES_DB: grounded
    ports:
      - "5433:5432"
    volumes:
      - grounded_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded -d grounded"]
      interval: 5s
      timeout: 5s
      retries: 5
 
volumes:
  grounded_pgdata:
 